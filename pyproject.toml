[project]
name = "aspen-edge-rrm"
version = "0.2.0"
description = "AspenOS edge Runtime Resource Manager"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
nats = ["nats-py>=2.6"]
mqtt = ["paho-mqtt>=2.0"]
all = ["nats-py>=2.6", "paho-mqtt>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aspen_edge*"]
